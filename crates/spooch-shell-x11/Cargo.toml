[package]
name = "spooch-shell-x11"
description = "Linux X11 shell: tray, shortcuts, capture, overlay and editor window"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "spooch-x11"
path = "src/main.rs"

[dependencies]
spooch-platform.workspace = true
spooch-render.workspace = true
spooch-app.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
x11rb = { version = "0.14", features = ["randr", "render", "shm"] }
