# One row: dots, back and forward, a centred address, share and +.
name = "Browser (Mac)"
colour = "#e8e8e8"
ink = "#6a6a6a"
radius = 10
border = 3

[[rows]]
height = 40
items = [
    { type = "space", width = 6 },
    { type = "dots", colours = ["#ff5f57", "#febc2e", "#28c840"] },
    { type = "space", width = 6 },
    { type = "back" },
    { type = "forward" },
    { type = "space", width = 10 },
    { type = "address", height = 24, lock = true, align = "center" },
    { type = "space", width = 8 },
    { type = "share" },
    { type = "plus" },
    { type = "space", width = 6 },
]
