# Development: the service and Postgres. Storage is a dev bucket on
# Spaces, set in .env (see .env.example); the Postgres password here is
# for this local setup only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: spooch
      POSTGRES_PASSWORD: spooch-dev
      POSTGRES_DB: spooch
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "spooch"]
      interval: 2s
      retries: 30

  spoochd:
    build: .
    env_file: .env
    environment:
      SPOOCH_DATABASE_URL: postgres://spooch:spooch-dev@db:5432/spooch
      SPOOCH_PUBLIC_URL: http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db:
