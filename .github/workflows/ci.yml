name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Prebuilt Skia links against the system FreeType and Fontconfig.
      - run: sudo apt-get update && sudo apt-get install -y libfreetype-dev libfontconfig-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  service:
    name: Service (gofmt, vet, tests)
    runs-on: ubuntu-latest
    # The store tests run against this as well as in memory.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: spooch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      SPOOCH_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/spooch_test
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: service/go.mod
          cache-dependency-path: service/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  windows:
    name: Windows (clippy, tests, release builds)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p spooch-shell-win -p spooch-render
      - name: Render benchmark
        run: target/release/spooch-render-bench.exe --out bench.png
      - uses: actions/upload-artifact@v4
        with:
          name: spooch-windows-x64
          path: |
            target/release/spooch.exe
            target/release/spooch-render-bench.exe
            bench.png
          if-no-files-found: error
